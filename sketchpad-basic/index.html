<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketchpad Basic</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #171717; background: #f5f5f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .app { width: min(1100px, 100%); }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .view-tools { display: flex; gap: 8px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
    .hint { color: #737373; font-size: 13px; }
    .board { position: relative; background: #fff; border: 1px solid #d4d4d4; border-radius: 18px; overflow: hidden; box-shadow: 0 12px 36px #0000000d; }
    .stage { position: relative; overflow: hidden; }
    canvas { display: block; width: 100%; height: min(68vh, 680px); cursor: crosshair; touch-action: none; background: #fff; }
    #preview { position: absolute; left: 0; top: 0; pointer-events: none; opacity: .55; background: transparent; }
    #canvas, #preview { transform-origin: 0 0; }
    #cursorRing { position: absolute; display: none; pointer-events: none; border: 2px dotted #171717; border-radius: 50%; transform: translate(-50%, -50%); z-index: 2; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; border-top: 1px solid #e5e5e5; background: #fafafa; }
    button, select, input { font: inherit; }
    button { border: 1px solid #d4d4d4; background: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
    button:hover { background: #f0f0f0; }
    button.active { color: #fff; background: #171717; border-color: #171717; }
    .separator { width: 1px; height: 28px; background: #dedede; margin: 0 4px; }
    .tool-group { display: inline-flex; gap: 8px; padding-right: 8px; border-right: 1px solid #dedede; }
    .file-group { display: inline-flex; gap: 8px; align-items: center; }
    .shape-group { position: relative; display: inline-flex; align-items: center; padding-right: 8px; border-right: 1px solid #dedede; }
    .shape-group button { width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; line-height: 1; font-size: 22px; }
    .shape-group > #shapeToggle { font-size: 22px; }
    .file-group svg { width: 22px; height: 22px; }
    #save svg, #export svg { width: 22px; height: 22px; transform: none; }
    .shape-group button.active { color: #fff; background: #171717; }
    .shape-menu { position: absolute; bottom: 38px; left: 0; z-index: 4; display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px solid #d4d4d4; border-radius: 10px; background: #fff; box-shadow: 0 8px 24px #0002; }
    .shape-menu[hidden] { display: none; }
    .side-tools .shape-menu { top: 0; bottom: auto; left: 38px; }
    .color-group { position: relative; display: inline-flex; align-items: center; padding-right: 8px; border-right: 1px solid #dedede; }
    .color-menu { position: absolute; bottom: 38px; left: 0; z-index: 4; display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid #d4d4d4; border-radius: 10px; background: #fff; box-shadow: 0 8px 24px #0002; }
    .color-menu[hidden] { display: none; }
    .side-tools .color-menu { top: 0; bottom: auto; left: 38px; }
    .color-swatch { width: 21px; min-width: 21px; height: 21px; padding: 0; border-radius: 50%; border: 2px solid #d4d4d4; }
    .color-swatch.active { outline: 2px solid #171717; outline-offset: 2px; }
    .pink-eraser { color: #ec4899; }
    label { display: inline-flex; align-items: center; gap: 8px; color: #525252; font-size: 13px; }
    input[type="range"] { width: 120px; accent-color: #171717; }
    .spacer { flex: 1; }
    #send { border-color: #171717; }
    .status { padding: 9px 12px 12px; color: #737373; font-size: 12px; }
    .note { width: 100%; padding: 10px 12px; border: 0; border-top: 1px solid #e5e5e5; outline: 0; color: #333; background: #fff; }
    .note-label { display: block; padding: 7px 12px 0; color: #777; font-size: 11px; }
    .note::placeholder { color: #999; }
    .note-area { position: relative; }
    .note-field { position: relative; }
    .note-suggestions { position: absolute; left: 0; right: 0; bottom: 100%; display: none; flex-direction: column; gap: 6px; padding: 8px 12px; border: 1px solid #e5e5e5; background: #fff; box-shadow: 0 -6px 18px #0001; z-index: 5; }
    .note-suggestions.show { display: flex; }
    .note-suggestions button { padding: 5px 8px; font-size: 12px; color: #555; }
    .side-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
    .side-tools .stage { grid-column: 1; grid-row: 1; }
    .side-tools .toolbar { grid-column: 2; grid-row: 1; flex-direction: column; align-items: stretch; justify-content: center; border-top: 0; border-left: 1px solid #e5e5e5; }
    .side-tools .toolbar .spacer { display: none; }
    .side-tools .status { grid-column: 1 / -1; grid-row: 2; }
    .dialog-backdrop { position: fixed; inset: 0; display: grid; place-items: center; background: #00000033; z-index: 10; }
    .dialog-backdrop[hidden] { display: none; }
    .dialog { width: min(320px, calc(100vw - 32px)); padding: 18px; border: 1px solid #d4d4d4; border-radius: 14px; background: #fff; box-shadow: 0 18px 50px #0003; }
    .dialog h2 { margin: 0 0 12px; font-size: 17px; }
    .dialog input { width: 100%; padding: 9px 10px; border: 1px solid #bdbdbd; border-radius: 8px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .export-option { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: #444; font-size: 14px; }
    .choice-dialog p { margin: 0 0 14px; color: #666; font-size: 13px; }
    .camera-preview { width: 100%; max-height: 55vh; display: block; border-radius: 8px; background: #171717; object-fit: contain; transform: scaleX(-1); }
    .camera-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
    .camera-tools button, .camera-tools select { flex: 1; min-width: 74px; padding: 5px 7px; font-size: 12px; border-radius: 8px; }
    .camera-adjustments { display: grid; gap: 2px; margin-top: 7px; }
    .camera-adjustments label { display: grid; grid-template-columns: 68px 1fr 34px; gap: 5px; align-items: center; color: #666; font-size: 11px; }
    .camera-adjustments input[type="range"] { height: 14px; }
    .camera-adjustments.collapsed { display: none; }
    .camera-dialog { position: relative; width: min(560px, calc(100vw - 32px)); }
    .camera-dialog .camera-preview { width: calc(100% - 150px); min-height: 220px; }
    .camera-dialog:has(.camera-adjustments.collapsed) .camera-preview { width: 100%; }
    .camera-dialog .camera-adjustments { position: absolute; top: 66px; right: 18px; width: 132px; margin: 0; }
    .camera-dialog .camera-adjustments label { grid-template-columns: 1fr; gap: 1px; }
    .camera-dialog .camera-adjustments output { text-align: right; }
    .camera-adjustments input[type="range"] { width: 100%; }
    @media (pointer: coarse) {
      button { min-width: 44px; min-height: 44px; }
      .shape-group button { width: 44px; height: 44px; }
      .color-swatch { width: 44px; min-width: 44px; height: 44px; }
      .camera-tools button, .camera-tools select { min-height: 44px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header><div><h1>Sketchpad Basic</h1><span class="hint">Draw an idea.</span></div><div class="view-tools"><button id="labelToggle" aria-label="Switch labels" title="Switch symbols and words">Aa</button><button id="layoutToggle" aria-label="Switch tool position" title="Move tools to the side">↕</button></div></header>
    <section class="board">
      <div class="stage"><canvas id="canvas" aria-label="Sketchpad Basic drawing canvas"></canvas><canvas id="preview" aria-hidden="true"></canvas><div id="cursorRing" aria-hidden="true"></div></div>
      <div class="toolbar">
        <span class="tool-group" aria-label="Drawing tools">
          <button id="pen" class="active" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='m4 20 3.2-.8L19 7.4a2 2 0 0 0-2.8-2.8L4.4 16.4 4 20Z'></path><path d='m14.8 5.2 4 4'></path></svg>" data-word="Pen" aria-label="Pen" title="Pen"></button>
          <button id="eraser" class="pink-eraser" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='currentColor'><path d='m15.5 3 5.5 5.5-10.9 10.9H4.6L2.5 17.3 15.5 3Zm-9.7 14.4 1.2 1.2h2.1l2.2-2.2-3.3-3.3-2.2 2.2v2.1Z'></path></svg>" data-word="Eraser" aria-label="Eraser" title="Eraser"></button>
          <button id="textTool" data-symbol="T" data-word="Text" aria-label="Text" title="Text">T</button>
          <button id="selectTool" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='m5 3 5.7 17 2.4-7.1L20 10.5 5 3Z'></path><path d='m13.1 13.1 5.2 5.2'></path></svg>" data-word="Select" aria-label="Select area to cut" title="Select area to cut"></button>
        </span>
        <span class="shape-group" aria-label="Shapes">
          <button id="shapeToggle" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><rect x='5' y='5' width='14' height='14'></rect></svg>" data-word="Shapes" aria-label="Choose shape" title="Choose shape"></button>
          <span id="shapeMenu" class="shape-menu" hidden>
            <button data-shape="line" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round'><path d='M5 19 19 5'></path></svg>" data-word="Line" aria-label="Line" title="Line"></button>
            <button data-shape="rect" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><rect x='5' y='5' width='14' height='14'></rect></svg>" data-word="Rectangle" aria-label="Rectangle" title="Rectangle"></button>
            <button data-shape="ellipse" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8'><circle cx='12' cy='12' r='7'></circle></svg>" data-word="Circle" aria-label="Circle" title="Circle"></button>
            <button data-shape="triangle" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linejoin='round'><path d='m12 5 8 14H4L12 5Z'></path></svg>" data-word="Triangle" aria-label="Triangle" title="Triangle"></button>
            <button data-shape="arrow" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M4 12h15m-5-5 5 5-5 5'></path></svg>" data-word="Arrow" aria-label="Arrow" title="Arrow"></button>
            <button data-shape="star" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linejoin='round'><path d='m12 4 2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8L12 4Z'></path></svg>" data-word="Star" aria-label="Star" title="Star"></button>
          </span>
        </span>
        <span class="color-group" aria-label="Colors">
          <button id="colorToggle" class="color-swatch active" aria-label="Choose color" title="Choose color" style="background:#ff00ff"></button>
          <span id="colorMenu" class="color-menu" hidden>
            <button class="color-swatch" data-color="#000000" aria-label="Black" title="Black" style="background:#000000"></button>
            <button class="color-swatch" data-color="#555555" aria-label="Gray" title="Gray" style="background:#555555"></button>
            <button class="color-swatch" data-color="#ff0000" aria-label="Red" title="Red" style="background:#ff0000"></button>
            <button class="color-swatch" data-color="#0066ff" aria-label="Blue" title="Blue" style="background:#0066ff"></button>
            <button class="color-swatch" data-color="#008000" aria-label="Green" title="Green" style="background:#008000"></button>
            <button class="color-swatch" data-color="#ffd000" aria-label="Yellow" title="Yellow" style="background:#ffd000"></button>
            <button class="color-swatch" data-color="#ff00ff" aria-label="Neon pink" title="Neon pink" style="background:#ff00ff"></button>
          </span>
        </span>
        <label class="opacity-control" title="Opacity">◐ <input id="opacity" type="range" min="10" max="100" value="100" aria-label="Opacity"><output id="opacityValue">100%</output></label>
        <span id="imageControls" hidden><label>Object size <input id="imageScale" type="range" min="25" max="200" value="100"><output id="imageScaleValue">100%</output></label><label>Rotate <input id="imageRotate" type="range" min="-180" max="180" value="0"><output id="imageRotateValue">0°</output></label><button id="placeObject" type="button">Place</button><button id="cancelObject" type="button">Cancel</button></span>
        <span class="separator"></span>
        <label>Size <input id="size" type="range" min="1" max="40" value="7"><output id="sizeValue">7</output></label>
        <span class="separator"></span><button id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button><output id="zoomValue">100%</output><button id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button><button id="zoomReset" aria-label="Reset zoom" title="Reset zoom">1:1</button>
        <button id="undo" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M9 7 4 12l5 5'></path><path d='M4 12h9a7 7 0 0 1 7 7'></path></svg>" data-word="Undo" aria-label="Undo" title="Undo"></button>
        <button id="redo" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='m15 7 5 5-5 5'></path><path d='M20 12h-9a7 7 0 0 0-7 7'></path></svg>" data-word="Redo" aria-label="Redo" title="Redo"></button>
        <button id="clear" data-symbol="<svg aria-hidden='true' width='19' height='19' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round'><path d='m5 5 14 14M19 5 5 19'></path></svg>" data-word="Clear" aria-label="Clear" title="Clear"></button>
        <span class="spacer"></span>
        <span class="file-group" aria-label="File actions"><button id="openImage" data-symbol="<svg aria-hidden='true' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='3.5' y='4' width='17' height='16' rx='2'></rect><circle cx='8.5' cy='9' r='1.5'></circle><path d='m5.5 17 4.5-4 3 2.5 2-2 3.5 3.5'></path></svg>" data-word="Open image" aria-label="Open image" title="Open image"></button><button id="camera" data-symbol="<svg aria-hidden='true' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M4 7h3l1.5-2h7L17 7h3v12H4V7Z'></path><circle cx='12' cy='13' r='3.5'></circle></svg>" data-word="Camera" aria-label="Take photo" title="Take photo"></button><button id="pasteImage" data-symbol="<svg aria-hidden='true' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='6' y='5' width='12' height='16' rx='2'></rect><path d='M9 5.5V4h6v1.5M9 10h6M9 14h6M9 18h3'></path></svg>" data-word="Paste" aria-label="Paste image" title="Paste image"></button><button id="save" data-symbol="<svg aria-hidden='true' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M4 3h13l3 3v15H4V3Z'></path><path d='M8 3v6h8V3M7 21v-7h10v7'></path></svg>" data-word="Save" aria-label="Save" title="Save"></button><button id="export" data-symbol="<svg aria-hidden='true' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M4 3h13l3 3v15H4V3Z'></path><path d='M8 3v6h8V3M7 21v-7h10v7'></path><path d='m14 19 1-3 5-5 2 2-5 5-3 1Z'></path><path d='m18 11 2 2'></path></svg>" data-word="Save As" aria-label="Save as" title="Save as"></button><button id="send" data-symbol="<svg aria-hidden='true' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='9' y='9' width='11' height='11' rx='2'></rect><path d='M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1'></path></svg>" data-word="Copy to Chat" aria-label="Copy sketch to ChatGPT" title="Copy sketch to ChatGPT"></button></span>
      </div>
      <div class="note-area"><div class="note-field"><label class="note-label" for="rules">Rules for ChatGPT</label><input id="rules" class="note" aria-label="Rules for ChatGPT" placeholder="How should ChatGPT interpret the sketch?"/><div id="rulesSuggestions" class="note-suggestions" aria-label="Rules suggestions"><button type="button" data-note-target="rules" data-note="Use the sketch as visual guidance. Preserve the important layout, placement, and relationships. Do not copy these instructions into the final project.">Basic rules</button><button type="button" data-note-target="rules" data-note="Explain what the sketch represents before making changes.">Explain the sketch</button><button type="button" data-note-target="rules" data-note="Focus on the layout, placement, size, and spacing.">Focus on layout</button><button type="button" data-note-target="rules" data-note="Treat the drawing as a rough concept, not finished artwork.">Rough concept</button><button type="button" data-note-target="rules" data-note="A camera photo may be included. Use it as visual reference and treat drawn marks as annotations on or around it.">Use camera photo</button><button type="button" data-note-target="rules" data-note="Pink marks are intentional highlights. Give them special attention, but do not add pink to the final result unless the request says to.">Pink is important</button><button type="button" data-note-target="rules" data-note="Ask questions before making assumptions about anything unclear.">Ask questions</button></div></div><div class="note-field"><label class="note-label" for="note">What to create</label><input id="note" class="note" aria-label="What to create" placeholder="What should ChatGPT make or change?"/><div id="noteSuggestions" class="note-suggestions" aria-label="Creation suggestions"><button type="button" data-note-target="note" data-note="Use the camera photo and annotations together as the visual reference.">Use camera photo as reference</button><button type="button" data-note-target="note" data-note="Move the part marked in pink.">Move pink-marked part</button><button type="button" data-note-target="note" data-note="Keep the pink highlights in the final design.">Keep pink highlights</button><button type="button" data-note-target="note" data-note="Suggest improvements while preserving the main idea.">Suggest improvements</button><button type="button" data-note-target="note" data-note="Recreate this as a clean design.">Make a clean design</button><button type="button" data-note-target="note" data-note="Turn the sketch into a clear creative brief.">Make a creative brief</button></div></div></div>
      <div class="status" id="status">Ready</div>
    </section>
  </main>
  <div id="saveDialog" class="dialog-backdrop" hidden>
    <form class="dialog" id="saveForm" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
      <h2 id="saveTitle">Save as</h2>
      <input id="filename" aria-label="File name" value="sketchpad-basic" autocomplete="off">
      <label class="export-option"><input id="whiteBackground" type="checkbox" checked> Include white background</label>
      <div class="dialog-actions"><button type="button" id="cancelSave">Cancel</button><button type="submit">Save</button></div>
    </form>
  </div>
  <div id="imageDialog" class="dialog-backdrop" hidden>
    <div class="dialog choice-dialog camera-dialog" role="dialog" aria-modal="true" aria-labelledby="imageTitle">
      <h2 id="imageTitle">Open image</h2>
      <p>Choose an image to add to the canvas.</p>
      <input id="imageInput" type="file" accept="image/*" aria-label="Choose image">
      <div class="dialog-actions"><button type="button" id="cancelImage">Cancel</button><button type="button" id="imageCanvas">Add image</button></div>
    </div>
  </div>
  <div id="cameraDialog" class="dialog-backdrop" hidden>
    <div class="dialog choice-dialog" role="dialog" aria-modal="true" aria-labelledby="cameraTitle">
      <h2 id="cameraTitle">Take a photo</h2>
      <p>Allow camera access, then capture an image to place on the canvas.</p>
      <video id="cameraPreview" class="camera-preview" autoplay playsinline></video>
      <div class="camera-adjustments collapsed" aria-label="Advanced photo adjustments"><label>Brightness <input id="cameraBrightness" type="range" min="50" max="150" value="100"><output id="cameraBrightnessValue">100%</output></label><label>Contrast <input id="cameraContrast" type="range" min="50" max="150" value="100"><output id="cameraContrastValue">100%</output></label><label>Color <input id="cameraSaturation" type="range" min="0" max="200" value="100"><output id="cameraSaturationValue">100%</output></label></div>
      <div class="camera-tools"><button type="button" id="toggleCameraAdjustments">Advanced</button><button type="button" id="switchCamera">⇄ Switch camera</button><select id="cameraTimer" aria-label="Capture timer"><option value="0">Timer: Off</option><option value="3">Timer: 3 sec</option><option value="10">Timer: 10 sec</option></select><button type="button" id="cropCamera">□ Crop: Off</button></div>
      <div class="dialog-actions"><button type="button" id="cancelCamera">Cancel</button><button type="button" id="captureCamera">Capture (Space)</button></div>
    </div>
  </div>
  <div id="textDialog" class="dialog-backdrop" hidden><form class="dialog" id="textForm" role="dialog" aria-modal="true" aria-labelledby="textTitle"><h2 id="textTitle">Add text</h2><input id="textInput" aria-label="Text" placeholder="Type something" autocomplete="off"><label>Size <input id="textSize" type="range" min="12" max="96" value="12"><output id="textSizeValue">12</output></label><div class="dialog-actions"><button type="button" id="cancelText">Cancel</button><button type="submit">Add</button></div></form></div>
  <script>
    const canvas = document.querySelector('#canvas');
    const ctx = canvas.getContext('2d');
    const preview = document.querySelector('#preview');
    const previewCtx = preview.getContext('2d');
    const pen = document.querySelector('#pen');
    const eraser = document.querySelector('#eraser');
    const size = document.querySelector('#size');
    const sizeValue = document.querySelector('#sizeValue');
    const status = document.querySelector('#status');
    const rules = document.querySelector('#rules');
    const note = document.querySelector('#note');
    const rulesSuggestions = document.querySelector('#rulesSuggestions');
    const noteSuggestions = document.querySelector('#noteSuggestions');

    opacityInput.oninput = () => { opacity = Number(opacityInput.value) / 100; opacityValue.value = `${opacityInput.value}%`; status.textContent = `Opacity ${opacityInput.value}%`; };

    document.querySelector('#openImage').onclick = () => { imageDialog.hidden = false; };

    cameraDialog.addEventListener('click', event => { if (event.target === cameraDialog) { cameraDialog.hidden = true; stopCamera(); } });
    imageInput.onchange = () => { if (imageInput.files.length) status.textContent = 'Image ready'; };
    document.querySelector('#send').onclick = async () => {
      const guidance = 'Use the sketch and note together as visual guidance. A camera photo may be included on the canvas; treat it as visual reference and treat drawn marks as annotations on or around it. Infer the intended idea from the layout, placement, shapes, colors, and relationships. Treat rough marks as a concept rather than exact finished artwork. When something is unclear, ask a brief question instead of guessing. These directions guide how to interpret the image; do not reproduce their wording in the final project.';

      const customNote = note.value.trim();

      const noteLines = noteText.split('\n').flatMap(paragraph => {
        const words = paragraph.split(/\s+/).filter(Boolean);
        const lines = [];
        let line = '';

          const candidate = line ? `${line} ${word}` : word;
          if (candidate.length > 52 && line) { lines.push(line); line = word; } else { line = candidate; }

        if (line) lines.push(line);

      output.height = canvas.height + noteHeight;

        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        status.textContent = noteLines.length ? 'Copied sketch + note — paste into ChatGPT' : 'Copied image — paste into ChatGPT';

        const link = document.createElement('a'); link.download = 'sketchpad-basic.png'; link.href = URL.createObjectURL(blob); link.click();
        status.textContent = 'Saved — add it to chat';

    };
    const dialogOpeners = new Map();
    function rememberDialogOpener(buttonId, dialogId) { const button = document.querySelector(`#${buttonId}`), backdrop = document.querySelector(`#${dialogId}`); if (!button || !backdrop) return; button.addEventListener('click', () => { dialogOpeners.set(dialogId, button); requestAnimationFrame(() => backdrop.querySelector('input, button, select')?.focus()); }, true); }
    [['export', 'saveDialog'], ['openImage', 'imageDialog'], ['camera', 'cameraDialog'], ['textTool', 'textDialog']].forEach(([buttonId, dialogId]) => rememberDialogOpener(buttonId, dialogId));
    ['cancelSave', 'cancelImage', 'cancelCamera', 'cancelText'].forEach(buttonId => document.querySelector(`#${buttonId}`)?.addEventListener('click', () => { const dialog = document.querySelector(`#${buttonId}`).closest('.dialog-backdrop'); dialogOpeners.get(dialog.id)?.focus(); }, true));
    window.addEventListener('keydown', event => { if (event.key !== 'Escape') return; const backdrop = [...document.querySelectorAll('.dialog-backdrop:not([hidden])')].pop(); if (!backdrop) return; event.preventDefault(); backdrop.hidden = true; if (backdrop.id === 'cameraDialog') stopCamera(); dialogOpeners.get(backdrop.id)?.focus(); });
    window.addEventListener('keydown', event => { const tag = event.target?.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return; if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); document.querySelector(event.shiftKey ? '#redo' : '#undo').click(); return; } if (!event.ctrlKey && !event.metaKey && (event.key === '[' || event.key === ']')) { event.preventDefault(); const next = Math.max(1, Math.min(40, Number(size.value) + (event.key === ']' ? 1 : -1))); size.value = next; sizeValue.value = next; cursorRing.style.width = `${next}px`; cursorRing.style.height = `${next}px`; status.textContent = `Size ${next}`; } });
    const recoveryKey = 'sketchpad-basic-recovery';
    function saveRecovery() { try { localStorage.setItem(recoveryKey, JSON.stringify({ image: canvas.toDataURL('image/png'), rules: rules.value, note: note.value, hasWork: history.length > 0 || Boolean(rules.value || note.value), savedAt: Date.now() })); } catch (error) {} }
    function restoreRecovery() { try { const saved = JSON.parse(localStorage.getItem(recoveryKey) || 'null'); if (!saved?.image || !saved.hasWork) return; if (!confirm('Restore your previous Sketchpad work?')) return; const image = new Image(); image.onload = () => { ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight); ctx.drawImage(image, 0, 0, canvas.clientWidth, canvas.clientHeight); rules.value = saved.rules || ''; note.value = saved.note || ''; status.textContent = 'Previous sketch restored'; }; image.src = saved.image; } catch (error) {} }
