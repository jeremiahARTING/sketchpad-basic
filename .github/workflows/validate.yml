name: Validate Sketchpad Basic

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
